---
- name: Créer le dossier des clés apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG NodeSource
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Ajouter le dépôt NodeSource
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_major }}.x nodistro main"
    filename: nodesource
    state: present

- name: Installer Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Installer PM2 globalement
  community.general.npm:
    name: pm2
    global: true
    state: present
